name: Native Android build v0.9

on:
  workflow_dispatch:
  push:
    branches: [ native-v09 ]

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate native source
        run: |
          mkdir -p /tmp/sidequest-native
          cat .native-v09-bundle/*.b64 | base64 -d > /tmp/sidequest-native.tar.gz
          tar -xzf /tmp/sidequest-native.tar.gz -C /tmp/sidequest-native
          find /tmp/sidequest-native -maxdepth 3 -type f | sort
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native debug APK
        working-directory: /tmp/sidequest-native
        run: gradle :app:assembleDebug --stacktrace
      - name: Inspect APK size
        run: ls -lh /tmp/sidequest-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sidequest-native-v09-apk
          path: /tmp/sidequest-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
